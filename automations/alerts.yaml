# Burnett Street Weather Station — Alert automations (v0.5 "Station Keeper")
#
# Fifteen automations: nine send one-shot alerts via the new dedicated
# Telegram bot ("Stuartfield Weather station" / @Stuartfieldstationbot), four
# keep the "today" high/low temperature helpers up to date, one (/report)
# replies on demand with a live snapshot (same idea as the house bot's /key,
# restricted to Michael's chat), and two are the "Station Keeper" — a prose
# logbook entry generated from live sensor readings with no internet or LLM
# dependency (rule-based Jinja phrase banks + `random`), sent at 07:00 (dawn
# watch, framed on the overnight low) and 18:00 (evening watch, framed on
# today's high and totals). These replace the old numeric 8:30am review.
#
# All alerts target chat_id 8090608278 (Michael) via the new bot's own
# Telegram Bot integration in HA — separate from the existing house bot.
#
# Source sensors used (all confirmed real GW3000A entities):
#   sensor.gw3000a_outdoor_temperature
#   sensor.gw3000a_wind_gust            — live instantaneous gust
#   sensor.gw3000a_max_daily_gust       — hardware's own daily peak gust
#   sensor.gw3000a_daily_rain           — today's rainfall total so far
#   sensor.gw3000a_relative_pressure
#
# New helpers required (see configuration.yaml):
#   input_number.burnett_record_temp_high_today
#   input_number.burnett_record_temp_low_today
#   input_number.burnett_alert_pressure_3h_ago
#   input_boolean.burnett_alert_wind_active
#   binary_sensor.burnett_weather_station_online (template, see configuration.yaml)
#
# IMPORTANT if you have more than one Telegram bot configured in HA: every
# telegram_bot.send_message call below carries a `config_entry_id` pinning
# it to this bot's own config entry (Settings → Devices & Services → this
# bot → note its entry ID, or build the action once in Developer Tools →
# Actions with "Config entry ID" ticked and read it back in YAML mode).
# Without this, HA can't tell which bot to send through once a second bot
# exists whose allowed chat IDs overlap with the first — it fails outright
# with "Please specify at least 1 notify entity" instead of guessing.

- id: burnett_alert_frost
  alias: "Burnett Alert – Frost Warning"
  description: "Notifies when outdoor temperature drops to 0°C or below."
  trigger:
    - platform: numeric_state
      entity_id: sensor.gw3000a_outdoor_temperature
      below: 0.1
      for:
        minutes: 2
  condition:
    - condition: template
      value_template: "{{ states('sensor.gw3000a_outdoor_temperature') | float(99) >= -30 }}"
  action:
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          ❄️ Frost warning — Stuartfield is at {{ states('sensor.gw3000a_outdoor_temperature') }}°C.

- id: burnett_alert_hard_frost
  alias: "Burnett Alert – Hard Frost Warning"
  description: "Notifies when outdoor temperature drops to -5°C or below."
  trigger:
    - platform: numeric_state
      entity_id: sensor.gw3000a_outdoor_temperature
      below: -4.9
      for:
        minutes: 2
  condition:
    - condition: template
      value_template: "{{ states('sensor.gw3000a_outdoor_temperature') | float(99) >= -30 }}"
  action:
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          🥶 Hard frost — Stuartfield is at {{ states('sensor.gw3000a_outdoor_temperature') }}°C. Watch stock water and pipes.

- id: burnett_alert_high_wind
  alias: "Burnett Alert – High Wind"
  description: >-
    Notifies when wind gusts exceed 50 km/h, and marks the alert active so
    the all-clear automation knows to watch for it easing off.
  trigger:
    - platform: numeric_state
      entity_id: sensor.gw3000a_wind_gust
      above: 50
  condition:
    - condition: template
      value_template: "{{ states('sensor.gw3000a_wind_gust') | float(0) <= 200 }}"
    - condition: state
      entity_id: input_boolean.burnett_alert_wind_active
      state: "off"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.burnett_alert_wind_active
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          💨 High wind — gusts at {{ states('sensor.gw3000a_wind_gust') }} km/h at Stuartfield.

- id: burnett_alert_wind_all_clear
  alias: "Burnett Alert – Wind All Clear"
  description: "Notifies when gusts drop back to 15 km/h or below after a high wind alert."
  trigger:
    - platform: numeric_state
      entity_id: sensor.gw3000a_wind_gust
      below: 15
  condition:
    - condition: state
      entity_id: input_boolean.burnett_alert_wind_active
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.burnett_alert_wind_active
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          ✅ Wind's eased off — gusts down to {{ states('sensor.gw3000a_wind_gust') }} km/h at Stuartfield.

- id: burnett_alert_new_record
  alias: "Burnett Alert – New All-Time Record"
  description: "Notifies whenever an all-time weather record is broken."
  trigger:
    - platform: state
      entity_id: input_number.burnett_record_temp_high_alltime
      id: "Highest Temperature"
    - platform: state
      entity_id: input_number.burnett_record_temp_low_alltime
      id: "Lowest Temperature"
    - platform: state
      entity_id: input_number.burnett_record_wind_gust_alltime
      id: "Highest Gust"
    - platform: state
      entity_id: input_number.burnett_record_rainfall_alltime
      id: "Wettest Day"
  condition:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none and trigger.from_state.state not in
           ['unknown', 'unavailable', 'none'] }}
  action:
    - variables:
        record_name: "{{ trigger.id }}"
        record_unit: >-
          {% if record_name in ['Highest Temperature', 'Lowest Temperature'] %}°C{% elif record_name == 'Highest Gust' %} km/h{% else %} mm{% endif %}
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          🏆 New record — {{ record_name }}: {{ trigger.to_state.state }}{{ record_unit }} at Stuartfield.

- id: burnett_alert_pressure_drop
  alias: "Burnett Alert – Pressure Drop"
  description: >-
    Every 3 hours, compares current pressure to the reading from 3 hours ago
    and alerts if it's dropped significantly — an early signal the weather's turning.
  trigger:
    - platform: time_pattern
      hours: "/3"
  action:
    - variables:
        current: "{{ states('sensor.gw3000a_relative_pressure') | float(0) }}"
        previous: "{{ states('input_number.burnett_alert_pressure_3h_ago') | float(current) }}"
        drop: "{{ previous - current }}"
    - if:
        - condition: template
          value_template: "{{ drop >= 3 and current > 0 }}"
      then:
        - service: telegram_bot.send_message
          data:
            config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
            chat_id: 8090608278
            message: >-
              📉 Pressure falling — down {{ drop | round(1) }} hPa in 3 hours, now {{ current }} hPa at Stuartfield. Weather may be turning.
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_alert_pressure_3h_ago
      data:
        value: "{{ current }}"

- id: burnett_alert_station_offline
  alias: "Burnett Alert – Station Offline"
  description: "Notifies if the weather station hasn't reported fresh data in over an hour."
  trigger:
    - platform: state
      entity_id: binary_sensor.burnett_weather_station_online
      to: "off"
  action:
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          ⚠️ Stuartfield Weather Station hasn't reported in over an hour — worth checking the GW3000A and the Pi.

- id: burnett_alert_station_online
  alias: "Burnett Alert – Station Back Online"
  description: "Notifies when the weather station starts reporting again after an offline alert."
  trigger:
    - platform: state
      entity_id: binary_sensor.burnett_weather_station_online
      from: "off"
      to: "on"
  action:
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          ✅ Stuartfield Weather Station is back online.

- id: burnett_alert_low_battery
  alias: "Burnett Alert – Low Battery"
  description: >-
    Watches every battery-type sensor belonging to the weather station
    (whatever their exact entity IDs turn out to be) and alerts when any go low.
  trigger:
    - platform: template
      value_template: >-
        {{ states.binary_sensor | selectattr('entity_id', 'search', 'gw3000a.*batt') | selectattr('state', 'eq', 'on') | list | count > 0 }}
  action:
    - variables:
        low_batteries: >-
          {{ states.binary_sensor | selectattr('entity_id', 'search', 'gw3000a.*batt') | selectattr('state', 'eq', 'on') | map(attribute='name') | list | join(', ') }}
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          🔋 Low battery — {{ low_batteries }} (Stuartfield Weather Station).

- id: burnett_records_update_today_high
  alias: "Burnett Records – Update Today's High"
  description: "Raises today's high-temperature reading whenever a warmer reading comes in."
  trigger:
    - platform: state
      entity_id: sensor.gw3000a_outdoor_temperature
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and trigger.to_state.state not in
           ['unknown', 'unavailable', 'none'] }}
  action:
    - variables:
        new_value: "{{ trigger.to_state.state | float }}"
    - condition: template
      value_template: "{{ new_value >= -30 and new_value <= 45 }}"
    - condition: template
      value_template: >-
        {{ states('input_number.burnett_record_temp_high_today') in
           ['unknown', 'unavailable', 'none']
           or new_value > states('input_number.burnett_record_temp_high_today') | float }}
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_record_temp_high_today
      data:
        value: "{{ new_value }}"

- id: burnett_records_update_today_low
  alias: "Burnett Records – Update Today's Low"
  description: "Lowers today's low-temperature reading whenever a colder reading comes in."
  trigger:
    - platform: state
      entity_id: sensor.gw3000a_outdoor_temperature
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and trigger.to_state.state not in
           ['unknown', 'unavailable', 'none'] }}
  action:
    - variables:
        new_value: "{{ trigger.to_state.state | float }}"
    - condition: template
      value_template: "{{ new_value >= -30 and new_value <= 45 }}"
    - condition: template
      value_template: >-
        {{ states('input_number.burnett_record_temp_low_today') in
           ['unknown', 'unavailable', 'none']
           or new_value < states('input_number.burnett_record_temp_low_today') | float }}
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_record_temp_low_today
      data:
        value: "{{ new_value }}"

- id: burnett_records_reset_today
  alias: "Burnett Records – Reset Today"
  description: >-
    At midnight, starts today's high/low fresh from the current live reading
    (same reasoning as the month/week resets — avoids 0 looking like a record).
  trigger:
    - platform: time
      at: "00:00:00"
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_record_temp_high_today
      data:
        value: >-
          {{ [[states('sensor.gw3000a_outdoor_temperature') | float(0), -30] | max, 45] | min }}
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_record_temp_low_today
      data:
        value: >-
          {{ [[states('sensor.gw3000a_outdoor_temperature') | float(0), -30] | max, 45] | min }}

- id: burnett_station_keeper_morning
  alias: "Burnett Station Keeper – Morning Log"
  description: >-
    Replaces the old numeric 8:30am review. Prose "logbook" entry generated
    entirely from live sensor states — no internet dependency, no external
    LLM call, just Jinja phrase banks picked with `random` for variety.
    Frames around the overnight low.
  trigger:
    - platform: time
      at: "07:00:00"
  action:
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          {%- set temp = states('sensor.gw3000a_outdoor_temperature') | float(0) -%}
          {%- set low = states('input_number.burnett_record_temp_low_today') | float(temp) -%}
          {%- set gust = states('sensor.gw3000a_wind_gust') | float(0) -%}
          {%- set rain = states('sensor.gw3000a_daily_rain') | float(0) -%}
          {%- set pressure = states('sensor.gw3000a_relative_pressure') | float(0) -%}
          {%- set pressure_prev = states('input_number.burnett_alert_pressure_3h_ago') | float(pressure) -%}
          {%- set pdiff = pressure - pressure_prev -%}
          {%- if low < -5 -%}
            {%- set temp_phrase = ['A hard frost gripped the yard overnight.', 'Overnight brought a proper hard frost.'] | random -%}
          {%- elif low < 0 -%}
            {%- set temp_phrase = ['Frost settled over Stuartfield overnight.', 'A good frost overnight, everything rimed white by dawn.'] | random -%}
          {%- elif low < 5 -%}
            {%- set temp_phrase = ['A sharp, cold start to the day.', 'A chilly one this morning, the cold biting at dawn.'] | random -%}
          {%- elif low < 10 -%}
            {%- set temp_phrase = ['A cool, fresh start to the day.', 'Nothing too testing this morning, just a cool edge to the air.'] | random -%}
          {%- elif low < 15 -%}
            {%- set temp_phrase = ['A mild start to the day.', 'An easy, gentle morning.'] | random -%}
          {%- else -%}
            {%- set temp_phrase = ['A warm start already, more like summer than expected.', 'Unusually warm for this hour.'] | random -%}
          {%- endif -%}
          {%- if gust < 5 -%}
            {%- set wind_phrase = ['Barely a breath of wind about.', 'The air is dead still.'] | random -%}
          {%- elif gust < 15 -%}
            {%- set wind_phrase = ['A light breeze drifting through.', 'Just a gentle breeze this morning.'] | random -%}
          {%- elif gust < 30 -%}
            {%- set wind_phrase = ['A steady breeze keeping things moving.', 'A brisk wind about already.'] | random -%}
          {%- elif gust < 50 -%}
            {%- set wind_phrase = ['Wind picking up sharply — worth minding today.', 'A stiff wind blowing, best secure loose gear.'] | random -%}
          {%- else -%}
            {%- set wind_phrase = ['Gale-force gusts battering the yard — take care out there.', 'The wind is up hard this morning, proper gale conditions.'] | random -%}
          {%- endif -%}
          {%- if rain <= 0 -%}
            {%- set rain_phrase = ['Dry underfoot so far.', 'Not a drop fallen yet.'] | random -%}
          {%- elif rain < 2 -%}
            {%- set rain_phrase = ['Just a spit of rain overnight.', 'A light dampness in the air, barely enough to call rain.'] | random -%}
          {%- elif rain < 10 -%}
            {%- set rain_phrase = (['Steady rain through the night — ', 'A fair soaking overnight, '] | random) ~ rain ~ 'mm logged.' -%}
          {%- else -%}
            {%- set rain_phrase = (['Heavy rain overnight — ', 'A proper downpour through the night, '] | random) ~ rain ~ 'mm and counting.' -%}
          {%- endif -%}
          {%- if pdiff <= -3 -%}
            {%- set pressure_phrase = ["Pressure's falling quick — weather's on the turn.", 'A sharp drop in pressure; change is coming.'] | random -%}
          {%- elif pdiff < -0.5 -%}
            {%- set pressure_phrase = ['Pressure easing back a touch.', 'A gentle fall in pressure.'] | random -%}
          {%- elif pdiff < 0.5 -%}
            {%- set pressure_phrase = ['Pressure holding steady, no sign of change.', 'Steady pressure, settled conditions likely.'] | random -%}
          {%- else -%}
            {%- set pressure_phrase = ["Pressure's climbing — set fair weather likely holding.", 'Rising pressure, a good sign for the day ahead.'] | random -%}
          {%- endif -%}
          {%- set parts = [
            "📖 *Station Keeper's Log* — " ~ now().strftime('%A, %d %B') ~ ', dawn watch.',
            temp_phrase,
            (low | round(1) | string) ~ '°C overnight, ' ~ (temp | round(1) | string) ~ '°C now.',
            wind_phrase,
            rain_phrase,
            pressure_phrase
          ] -%}
          {{ parts | join(' ') }}

- id: burnett_station_keeper_evening
  alias: "Burnett Station Keeper – Evening Log"
  description: >-
    Evening companion to the morning log. Same rule-based Jinja approach,
    framed around today's high and the day's totals rather than the
    overnight low.
  trigger:
    - platform: time
      at: "18:00:00"
  action:
    - service: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          {%- set temp = states('sensor.gw3000a_outdoor_temperature') | float(0) -%}
          {%- set high = states('input_number.burnett_record_temp_high_today') | float(temp) -%}
          {%- set gust = states('sensor.gw3000a_max_daily_gust') | float(0) -%}
          {%- set rain = states('sensor.gw3000a_daily_rain') | float(0) -%}
          {%- set pressure = states('sensor.gw3000a_relative_pressure') | float(0) -%}
          {%- set pressure_prev = states('input_number.burnett_alert_pressure_3h_ago') | float(pressure) -%}
          {%- set pdiff = pressure - pressure_prev -%}
          {%- if high < 0 -%}
            {%- set temp_phrase = ['A bitter day throughout, never above freezing.', 'The cold held its grip all day.'] | random -%}
          {%- elif high < 5 -%}
            {%- set temp_phrase = ['A cold day from start to finish.', 'Little warmth to be had today.'] | random -%}
          {%- elif high < 10 -%}
            {%- set temp_phrase = ['A cool, grey sort of day.', 'Nothing remarkable in the temperature today.'] | random -%}
          {%- elif high < 15 -%}
            {%- set temp_phrase = ['A mild, easy day.', 'Pleasant conditions held through the day.'] | random -%}
          {%- elif high < 20 -%}
            {%- set temp_phrase = ['A properly warm day for Stuartfield.', 'Good warmth in the air today.'] | random -%}
          {%- else -%}
            {%- set temp_phrase = ['A hot one today, well above the seasonal average.', 'Real summer warmth today.'] | random -%}
          {%- endif -%}
          {%- if gust < 5 -%}
            {%- set wind_phrase = ['Calm throughout, barely a breath all day.', 'A still day, nothing stirring.'] | random -%}
          {%- elif gust < 15 -%}
            {%- set wind_phrase = ['Light breezes drifted through the day.', 'A gentle day for wind.'] | random -%}
          {%- elif gust < 30 -%}
            {%- set wind_phrase = ['A steady breeze held through the day.', 'Breezy conditions throughout.'] | random -%}
          {%- elif gust < 50 -%}
            {%- set wind_phrase = (['Wind picked up sharply at points today — ', 'A blustery day, gusting to '] | random) ~ (gust | round(0) | string) ~ ' km/h at the peak.' -%}
          {%- else -%}
            {%- set wind_phrase = (['Gale-force gusts battered the yard today — ', 'A wild day for wind, gusting to '] | random) ~ (gust | round(0) | string) ~ ' km/h. Mind anything loose overnight.' -%}
          {%- endif -%}
          {%- if rain <= 0 -%}
            {%- set rain_phrase = ['Dry all day, not a drop fallen.', 'No rain to speak of today.'] | random -%}
          {%- elif rain < 2 -%}
            {%- set rain_phrase = ['Just a trace of rain today.', 'Barely enough rain to log.'] | random -%}
          {%- elif rain < 10 -%}
            {%- set rain_phrase = (['Steady rain through the day — ', ''] | random) ~ rain ~ 'mm logged, a fair soaking.' -%}
          {%- else -%}
            {%- set rain_phrase = (['A proper downpour today — ', 'Heavy rain throughout, '] | random) ~ rain ~ 'mm in the gauge.' -%}
          {%- endif -%}
          {%- if pdiff <= -3 -%}
            {%- set pressure_phrase = ["Pressure's been falling — keep an eye out overnight.", 'A notable drop in pressure through the afternoon; change may be coming.'] | random -%}
          {%- elif pdiff < -0.5 -%}
            {%- set pressure_phrase = ['Pressure easing back a touch this evening.', 'A gentle fall in pressure.'] | random -%}
          {%- elif pdiff < 0.5 -%}
            {%- set pressure_phrase = ['Pressure steady this evening, settled conditions likely overnight.', 'Holding steady — a quiet night expected.'] | random -%}
          {%- else -%}
            {%- set pressure_phrase = ["Pressure's on the rise — fair conditions likely holding.", 'Climbing pressure this evening, a good sign.'] | random -%}
          {%- endif -%}
          {%- set parts = [
            "📖 *Station Keeper's Log* — " ~ now().strftime('%A, %d %B') ~ ', evening watch.',
            temp_phrase,
            'Topped out at ' ~ (high | round(1) | string) ~ '°C today, ' ~ (temp | round(1) | string) ~ '°C now.',
            wind_phrase,
            rain_phrase,
            pressure_phrase
          ] -%}
          {{ parts | join(' ') }}

- id: burnett_alert_report_command
  alias: "Burnett Alert – /report Command"
  description: >-
    Telegram command for the weather bot: replies with a live snapshot of
    current readings (not "today so far" like the 8:30am review — this is
    right now). Restricted to Michael's chat.
  triggers:
    - trigger: event
      event_type: telegram_command
      event_data:
        command: /report
  conditions:
    - condition: template
      value_template: "{{ trigger.event.data.chat_id == 8090608278 }}"
  actions:
    - action: telegram_bot.send_message
      data:
        config_entry_id: 01M3MJMXJPXZDDAQ1NF2HE13GW
        chat_id: 8090608278
        message: >-
          {%- set dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'] -%}
          {%- set deg = states('sensor.gw3000a_wind_direction') | float(0) -%}
          {%- set compass = dirs[ ((deg / 22.5) + 0.5) | int % 16 ] -%}
          {%- set lines = ['🌤️ *Stuartfield Weather Station — Live Report*', ''] -%}
          {%- set lines = lines + ['Temp: ' ~ states('sensor.gw3000a_outdoor_temperature') ~ '°C · Humidity: ' ~ states('sensor.gw3000a_humidity') ~ '%'] -%}
          {%- set lines = lines + ['Wind: ' ~ states('sensor.gw3000a_wind_speed') ~ ' km/h, gusting ' ~ states('sensor.gw3000a_wind_gust') ~ ' km/h from ' ~ compass] -%}
          {%- set lines = lines + ['Rain today: ' ~ states('sensor.gw3000a_daily_rain') ~ 'mm · Rate: ' ~ states('sensor.gw3000a_rain_rate') ~ 'mm/h'] -%}
          {%- set lines = lines + ['Pressure: ' ~ states('sensor.gw3000a_relative_pressure') ~ ' hPa'] -%}
          {%- set lines = lines + ['UV index: ' ~ states('sensor.gw3000a_uv_index') ~ ' · Solar: ' ~ states('sensor.gw3000a_solar_radiation') ~ ' W/m²'] -%}
          {%- set lines = lines + ['', 'As of ' ~ now().strftime('%H:%M')] -%}
          {{ lines | join('\n') }}
  mode: single
