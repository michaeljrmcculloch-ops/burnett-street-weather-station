# Burnett Street Weather Station — Records automations (v0.4 "Frost")
#
# Eight automations that keep the burnett_record_* input_number /
# input_datetime helpers up to date so the Records ledger card has
# something to show. Paste these into your automations.yaml (or add
# them one by one through Settings → Automations → Create Automation →
# Edit in YAML).
#
# Source sensors used:
#   sensor.gw3000a_outdoor_temperature  — for both the high and low
#   sensor.gw3000a_max_daily_gust       — the hardware's own daily peak gust
#   sensor.gw3000a_daily_rain           — today's rainfall total so far
#
# Helpers required (see helpers/records.yaml): for every metric
# (temp_high, temp_low, wind_gust, rainfall) and every period
# (alltime, month, week) there is one input_number.burnett_record_*
# and one input_datetime.burnett_record_*_date.

- id: burnett_records_update_alltime_highs
  alias: "Burnett Records – Update All-Time Highs"
  description: >-
    Checks temperature, gust and rainfall on every update and raises
    the all-time record whenever the live reading beats it.
  trigger:
    - platform: state
      entity_id: sensor.gw3000a_outdoor_temperature
      id: temp_high
    - platform: state
      entity_id: sensor.gw3000a_max_daily_gust
      id: wind_gust
    - platform: state
      entity_id: sensor.gw3000a_daily_rain
      id: rainfall
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and trigger.to_state.state not in
           ['unknown', 'unavailable', 'none'] }}
  action:
    - variables:
        metric: "{{ trigger.id }}"
        new_value: "{{ trigger.to_state.state | float }}"
        record_entity: "input_number.burnett_record_{{ metric }}_alltime"
        date_entity: "input_datetime.burnett_record_{{ metric }}_alltime_date"
    - condition: template
      value_template: >-
        {% set bounds = {'temp_high': (-30, 45), 'wind_gust': (0, 200), 'rainfall': (0, 300)} %}
        {{ new_value >= bounds[metric][0] and new_value <= bounds[metric][1] }}
    - condition: template
      value_template: >-
        {{ states(record_entity) in ['unknown', 'unavailable', 'none']
           or new_value > states(record_entity) | float }}
    - service: input_number.set_value
      target:
        entity_id: "{{ record_entity }}"
      data:
        value: "{{ new_value }}"
    - service: input_datetime.set_datetime
      target:
        entity_id: "{{ date_entity }}"
      data:
        date: "{{ now().strftime('%Y-%m-%d') }}"

- id: burnett_records_update_alltime_low
  alias: "Burnett Records – Update All-Time Low"
  description: "Lowers the all-time low-temperature record whenever it's beaten."
  trigger:
    - platform: state
      entity_id: sensor.gw3000a_outdoor_temperature
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and trigger.to_state.state not in
           ['unknown', 'unavailable', 'none'] }}
  action:
    - variables:
        new_value: "{{ trigger.to_state.state | float }}"
    - condition: template
      value_template: "{{ new_value >= -30 and new_value <= 45 }}"
    - condition: template
      value_template: >-
        {{ states('input_number.burnett_record_temp_low_alltime') in
           ['unknown', 'unavailable', 'none']
           or new_value < states('input_number.burnett_record_temp_low_alltime') | float }}
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_record_temp_low_alltime
      data:
        value: "{{ new_value }}"
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.burnett_record_temp_low_alltime_date
      data:
        date: "{{ now().strftime('%Y-%m-%d') }}"

