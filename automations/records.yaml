- id: burnett_records_reset_month
  alias: "Burnett Records – Reset Month"
  description: >-
    At midnight on the 1st of the month, starts this month's records
    fresh from the current live readings rather than zeroing them out
    (a reading of 0 would otherwise look like a record low).
  trigger:
    - platform: time
      at: "00:00:00"
  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_record_temp_high_month
      data:
        value: >-
          {{ [[states('sensor.gw3000a_outdoor_temperature') | float(0), -30] | max, 45] | min }}
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_record_temp_low_month
      data:
        value: >-
          {{ [[states('sensor.gw3000a_outdoor_temperature') | float(0), -30] | max, 45] | min }}
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_record_wind_gust_month
      data:
        value: >-
          {{ [[states('sensor.gw3000a_max_daily_gust') | float(0), 0] | max, 200] | min }}
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_record_rainfall_month
      data:
        value: >-
          {{ [[states('sensor.gw3000a_daily_rain') | float(0), 0] | max, 300] | min }}
    - service: input_datetime.set_datetime
      target:
        entity_id:
          - input_datetime.burnett_record_temp_high_month_date
          - input_datetime.burnett_record_temp_low_month_date
          - input_datetime.burnett_record_wind_gust_month_date
          - input_datetime.burnett_record_rainfall_month_date
      data:
        date: "{{ now().strftime('%Y-%m-%d') }}"

- id: burnett_records_reset_week
  alias: "Burnett Records – Reset Week"
  description: >-
    At midnight every Monday, starts this week's records fresh from
    the current live readings, same reasoning as the month reset.
  trigger:
    - platform: time
      at: "00:00:00"
  condition:
    - condition: template
      value_template: "{{ now().weekday() == 0 }}"
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.burnett_record_temp_high_week
      data:
        value: >-
          {{ [[states('sensor.gw3000a_outdoor_temperature') | float(0), -30] | max, 45] | min }}
