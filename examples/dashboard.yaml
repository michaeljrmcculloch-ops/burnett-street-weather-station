title: Weather Station
views:
  - title: Weather Station
    path: weather-station
    icon: mdi:weather-partly-cloudy
    cards:
      - type: custom:burnett-vintage-barometer
        entity: sensor.gw3000a_relative_pressure
        trend_entity: sensor.burnett_pressure_trend   # optional, see docs
        name: Burnett Street
        subtitle: Weather Station
        established: "2026"
        min_pressure: 950
        max_pressure: 1050
        unit: hPa
        theme: classic_oak       # or "observatory"
        decimals: 1
      - type: custom:burnett-vintage-thermometer
        entity: sensor.gw3000a_outdoor_temperature
        name: Burnett Street
        subtitle: Weather Station
        established: "2026"
        min_temp: -10
        max_temp: 40
        unit: °C
        theme: classic_oak
        show_daily_high: true
        high_window_hours: 24
      - type: custom:burnett-vintage-hygrometer
        entity: sensor.gw3000a_humidity
        name: Burnett Street
        subtitle: Weather Station
        established: "2026"
        theme: classic_oak
      - type: custom:burnett-vintage-wind-compass
        entity: sensor.gw3000a_wind_direction
        speed_entity: sensor.gw3000a_wind_speed
        gust_entity: sensor.gw3000a_wind_gust
        name: Burnett Street
        subtitle: Weather Station
        established: "2026"
        speed_unit: mph
        theme: classic_oak
      - type: custom:burnett-vintage-wind-speed
        entity: sensor.gw3000a_wind_speed
        gust_entity: sensor.gw3000a_wind_gust
        name: Burnett Street
        subtitle: Weather Station
        established: "2026"
        max_speed: 80
        speed_unit: mph
        theme: classic_oak
        show_peak_gust: true
        peak_gust_window_minutes: 30
      - type: custom:burnett-vintage-rain-gauge
        entity: sensor.gw3000a_daily_rain
        rate_entity: sensor.gw3000a_rain_rate
        name: Burnett Street
        subtitle: Weather Station
        established: "2026"
        max_daily: 50
        unit: mm
        theme: classic_oak
      - type: custom:burnett-vintage-uv-index
        entity: sensor.gw3000a_uv_index
        name: Burnett Street
        subtitle: Weather Station
        established: "2026"
        theme: classic_oak
      - type: custom:burnett-vintage-solar
        entity: sensor.gw3000a_solar_radiation
        name: Burnett Street
        subtitle: Weather Station
        established: "2026"
        max_solar: 1200
        unit: W/m²
        theme: classic_oak
